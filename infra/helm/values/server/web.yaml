nameOverride: web
fullnameOverride: web

image:
  repository: chirper/web
  tag: dev

service:
  ports:
    - name: http
      port: 80
      targetPort: 3000
      containerPort: 3000

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: BFF_INTERNAL_URL
    value: http://bff
  - name: NEXT_PUBLIC_BFF_URL
    value: https://api.chirper.bobbycrimson.com
  - name: SESSION_COOKIE_SECURE
    value: "true"

probes:
  liveness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
  hosts:
    - host: chirper.bobbycrimson.com
      paths:
        - path: /
          pathType: Prefix
          servicePortName: http
